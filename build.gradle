plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'me.champeau.jmh' version '0.7.2'
    alias libs.plugins.modDevGradle
    alias libs.plugins.machete
    alias libs.plugins.spotless
}

version = mod_version
group = maven_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

apply from: "$rootDir/gradle/scripts/dependencies.gradle"
apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/publishing.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/gradle/scripts/resources.gradle"
apply from: "$rootDir/gradle/scripts/spotless.gradle"


// Formats the mod version to include the loader, Minecraft version, and build number (if present)
String buildNumber = System.getenv("GITHUB_ACTION_NUMBER")
version = "${mod_version}" + (buildNumber != null ? "-build.${System.getenv("GITHUB_RUN_NUMBER")}" : "")


// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

machete {
    // disable machete locally for faster builds
    enabled = false
}

tasks.build.dependsOn(tasks.spotlessCheck)

def jmhQuick = project.hasProperty('jmhQuick')

jmh {
    warmupIterations = jmhQuick ? 1 : 5
    iterations = jmhQuick ? 1 : 5
    fork = jmhQuick ? 1 : 2
    warmup = jmhQuick ? '200ms' : '2s'
    timeOnIteration = jmhQuick ? '300ms' : '2s'
    resultFormat = 'JSON'
    profilers = ['gc']
    failOnError = true
}

tasks.named('jmhJar') {
    zip64 = true
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
